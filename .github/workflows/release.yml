name: Release

# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version from Cargo.toml>)"
        required: false
        type: string
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64 + universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-macos.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="${INPUT_TAG:-v$VERSION}"; fi
          FLAGS=()
          [[ "$DRAFT" == "true" ]] && FLAGS+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          ls -la artifacts
          gh release create "$TAG" artifacts/* --title "Pulse $TAG" --target "$GITHUB_SHA" \
            --notes "Needs mpv, ffmpeg and yt-dlp at runtime. See the README for setup." "${FLAGS[@]}"
