name: Release

# A push to main releases the version in Cargo.toml if it has no release yet: raise
# the version for a new one. Also runs from the Actions tab ("Run workflow") or for
# a pushed tag like v0.1.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version from Cargo.toml>)"
        required: false
        type: string
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# One at a time: a run queued behind another sees its release and stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="${INPUT_TAG:-v$VERSION}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists already, nothing to build. Raise the version in Cargo.toml for a new one."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # mpv, ffmpeg and QuickJS for the macOS and Windows packages (scripts/build-tools.sh),
  # kept in the cache until the script changes.
  tools:
    name: Tools (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: macos-x86_64
            runner: macos-14
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: dist/tools-${{ matrix.target }}
          key: tools-${{ matrix.target }}-${{ hashFiles('scripts/build-tools.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install meson nasm pkgconf
          scripts/build-tools.sh ${{ matrix.target }}
      - if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make diffutils curl tar xz
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-cppwinrt
      - if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-tools.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.target }}
          path: dist/tools-${{ matrix.target }}

  macos:
    name: macOS (Apple silicon + Intel)
    needs: [plan, tools]
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: tools-macos-*
          path: dist
      # Artifacts lose the executable bit.
      - run: |
          chmod +x dist/tools-macos-*/{mpv,ffmpeg,qjs}
          scripts/build-macos.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    name: Windows (x64)
    needs: [plan, tools]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: tools-windows-x64
          path: dist/tools-windows-x64
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    name: Linux (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb

  publish:
    needs: [plan, macos, windows, linux]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Pushes publish at once; a run from the Actions tab makes a draft unless told otherwise.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=()
          [[ "$DRAFT" == "true" ]] && FLAGS+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          # Only the packages: the downloads also hold the tools-* artifacts (bare binaries, LICENSES/).
          PACKAGES=(artifacts/*.dmg artifacts/*.zip artifacts/*.tar.gz artifacts/*.deb)
          ls -la "${PACKAGES[@]}"
          gh release create "$TAG" "${PACKAGES[@]}" --title "Pulse $TAG" --target "$GITHUB_SHA" \
            --notes "macOS: apple-silicon (M1 and later) or intel. The macOS and Windows downloads carry everything Pulse needs; the Linux .deb installs mpv and ffmpeg with it. Pulse fetches yt-dlp itself. See the README." "${FLAGS[@]}"
